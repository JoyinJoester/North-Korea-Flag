name: Update Contributor Flag

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate contributor SVG
        run: python generate.py --repo JoyinJoester/North-Korea-Flag

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output.svg flag.svg
          git diff --cached --quiet || git commit -m "Update contributor flag SVG"
          git push
